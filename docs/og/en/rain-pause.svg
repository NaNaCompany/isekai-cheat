="21"><tspan x="60" y="768" textLength="866.25" lengthAdjust="spacingAndGlyphs">Drawback: Held rain falls together afterward, and your shoes squeak all day.</tspan></text><path d="M60 795 H1140" stroke="#d8dedf" stroke-width="1"/><text x="60" y="826" fill="#37434a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21"><tspan x="60" y="826" textLength="635.67" lengthAdjust="spacingAndGlyphs">First use: Buy time for traders to unfold their awnings.</tspan></text><path d="M60 866 H1140" stroke="#347368" stroke-width="2" opacity=".45"/></svg>