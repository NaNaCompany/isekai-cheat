<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Left-Sock Porter"><title>Left-Sock Porter</title><desc>A sock helper handles one small errand. · Ability: A sock-shaped assistant carries light objects. · Activation: Wear mismatched socks and hop three times on your left foot. · Limit: One task for ten minutes, up to 1 kg; cannot climb stairs. · Drawback: Your left foot tickles while the helper exists. · First use: Move letters from an overflowing desk into a nearby box.</desc><rect width="1200" height="900" rx="28" fill="#fbfaf6"/><path d="M60 34 H1140" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/><svg x="620" y="60" width="530" height="397.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Left-Sock Porter"><title>Left-Sock Porter</title><desc>A sock helper handles one small errand.</desc><rect width="800" height="600" rx="36" fill="#edf5f3"/><circle cx="400" cy="277" r="223" fill="#fff" opacity=".38"/><path d="M71 488 Q180 445 262 474 M538 474 Q620 445 729 488" fill="none" stroke="#8c4463" stroke-width="2" opacity=".19"/><ellipse cx="400" cy="553" rx="186" ry="17" fill="#8c4463" opacity=".13"/><g transform="rotate(0 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(30 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(60 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(90 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(150 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="