<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Cupom de amanhecer"><title>Cupom de amanhecer</title><desc>Guarde luz da manhã em porções de dez segundos. · Poder: Libera luz solar guardada para iluminar e aquecer suavemente. · Ativação: Veja o nascer do sol acordado e segure papel em branco. · Limite: Um por dia, até sete guardados; dez segundos cada, sem acender fogo. · Custo: Nesse dia você sente muito sono ao meio-dia. · Primeiro uso: Você procura uma agulha caída em um depósito escuro.</desc><rect width="1200" height="900" rx="28" fill="#fbfaf6"/><path d="M60 34 H1140" stroke="#347368" stroke-width="5" stroke-linecap="round"/><svg x="620" y="60" width="530" height="397.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Cupom de amanhecer"><title>Cupom de amanhecer</title><desc>Guarde luz da manhã em porções de dez segundos.</desc><rect width="800" height="600" rx="36" fill="#ecf5e9"/><circle cx="400" cy="277" r="223" fill="#fff" opacity=".38"/><path d="M71 488 Q180 445 262 474 M538 474 Q620 445 729 488" fill="none" stroke="#347368" stroke-width="2" opacity=".19"/><ellipse cx="400" cy="553" rx="186" ry="17" fill="#347368" opacity=".13"/><g transform="rotate(0 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(30 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(60 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(90 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(150 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368"