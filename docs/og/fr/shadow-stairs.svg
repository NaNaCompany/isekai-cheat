<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Escalier d’ombre"><title>Escalier d’ombre</title><desc>Des marches temporaires pour atteindre une hauteur. · Pouvoir: Dresse votre ombre en escalier solide. · Activation: Comptez jusqu’à sept en regardant votre ombre. · Limite: Douze marches pendant trente secondes ; ombre visible nécessaire. · Contrepartie: Vous avez le hoquet pendant une minute ensuite. · Premier usage: Vous récupérez un panier d’herbes coincé dans un arbre.</desc><rect width="1200" height="900" rx="28" fill="#fbfaf6"/><path d="M60 34 H1140" stroke="#347368" stroke-width="5" stroke-linecap="round"/><svg x="620" y="60" width="530" height="397.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Escalier d’ombre"><title>Escalier d’ombre</title><desc>Des marches temporaires pour atteindre une hauteur.</desc><rect width="800" height="600" rx="36" fill="#ecf5e9"/><circle cx="400" cy="277" r="223" fill="#fff" opacity=".38"/><path d="M71 488 Q180 445 262 474 M538 474 Q620 445 729 488" fill="none" stroke="#347368" stroke-width="2" opacity=".19"/><ellipse cx="400" cy="553" rx="186" ry="17" fill="#347368" opacity=".13"/><g transform="rotate(0 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(30 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(60 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(90 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(150 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5"