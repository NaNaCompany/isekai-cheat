<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Assistant chaussette gauche"><title>Assistant chaussette gauche</title><desc>Une chaussette accomplit une petite course. · Pouvoir: Un assistant en forme de chaussette porte des objets légers. · Activation: Portez des chaussettes dépareillées et sautez trois fois du pied gauche. · Limite: Une tâche durant dix minutes, jusqu’à 1 kg ; pas d’escaliers. · Contrepartie: Votre pied gauche vous chatouille tant que l’assistant existe. · Premier usage: Vous déplacez des lettres vers une boîte à côté du bureau plein.</desc><rect width="1200" height="900" rx="28" fill="#fbfaf6"/><path d="M60 34 H1140" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/><svg x="620" y="60" width="530" height="397.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Assistant chaussette gauche"><title>Assistant chaussette gauche</title><desc>Une chaussette accomplit une petite course.</desc><rect width="800" height="600" rx="36" fill="#edf5f3"/><circle cx="400" cy="277" r="223" fill="#fff" opacity=".38"/><path d="M71 488 Q180 445 262 474 M538 474 Q620 445 729 488" fill="none" stroke="#8c4463" stroke-width="2" opacity=".19"/><ellipse cx="400" cy="553" rx="186" ry="17" fill="#8c4463" opacity=".13"/><g transform="rotate(0 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(30 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(60 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(90 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#8c4463" stroke-width="5" stroke-linecap="round"/></g><g transform