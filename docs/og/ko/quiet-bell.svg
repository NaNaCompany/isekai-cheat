<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="소음 보관 종"><title>소음 보관 종</title><desc>소리 하나를 잠시 담아 두는 종. · 능력: 선택한 반복 소음을 종 안에 가둔다. · 발동 조건: 종을 울리지 않고 흔들며 소리의 원인을 말한다. · 한계: 반경 3 m, 10분. 말소리와 경고음은 가둘 수 없다. · 대가: 발걸음마다 작은 방울 소리가 한 시간 난다. · 첫 사용: 낮잠 시간에 삐걱대는 물레 소리를 가둔다.</desc><rect width="1200" height="900" rx="28" fill="#fbfaf6"/><path d="M60 34 H1140" stroke="#347368" stroke-width="5" stroke-linecap="round"/><svg x="620" y="60" width="530" height="397.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="소음 보관 종"><title>소음 보관 종</title><desc>소리 하나를 잠시 담아 두는 종.</desc><rect width="800" height="600" rx="36" fill="#ecf5e9"/><circle cx="400" cy="277" r="223" fill="#fff" opacity=".38"/><path d="M71 488 Q180 445 262 474 M538 474 Q620 445 729 488" fill="none" stroke="#347368" stroke-width="2" opacity=".19"/><ellipse cx="400" cy="553" rx="186" ry="17" fill="#347368" opacity=".13"/><g transform="rotate(0 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(30 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(60 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(90 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(150 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(180 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(210 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stro