m-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700"><tspan x="60" y="105" textLength="337.26" lengthAdjust="spacingAndGlyphs">10초 빗방울 정지</tspan></text><text x="60" y="145" fill="#505b61" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25"><tspan x="60" y="145" textLength="375.5" lengthAdjust="spacingAndGlyphs">빗방울만 공중에서 잠깐 멈춘다.</tspan></text><text x="60" y="505" fill="#347368" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="700"></text><path d="M60 563 H1140" stroke="#d8dedf" stroke-width="1"/><text x="60" y="594" fill="#37434a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21"><tspan x="60" y="594" textLength="513.45" lengthAdjust="spacingAndGlyphs">능력: 주변에 떨어지는 빗방울을 공중에 정지시킨다.</tspan></text><path d="M60 621 H1140" stroke="#d8dedf" stroke-width="1"/><text x="60" y="652" fill="#37434a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21"><tspan x="60" y="652" textLength="601.02" lengthAdjust="spacingAndGlyphs">발동 조건: 젖은 손으로 하늘을 가리키고 열까지 거꾸로 센다.</tspan></text><path d="M60 679 H1140" stroke="#d8dedf" stroke-width="1"/><text x="60" y="710" fill="#37434a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21"><tspan x="60" y="710" textLength="611.52" lengthAdjust="spacingAndGlyphs">한계: 반경 100 m, 열 초, 하루 한 번. 바람과 번개는 그대로다.</tspan></text><path d="M60 737 H1140" stroke="#d8dedf" stroke-width="1"/><text x="60" y="768" fill="#37434a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21"><tspan x="60" y="768" textLength="696.36" lengthAdjust="spacingAndGlyphs">대가: 멈춘 비는 끝에 한꺼번에 쏟아지고 당신의 신발은 하루 삑삑댄다.</tspan></text><path d="M60 795 H1140" stroke="#d8dedf" stroke-width="1"/><text x="60" y="826" fill="#37434a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21"><tspan x="60" y="826" textLength="578.97" lengthAdjust="spacingAndGlyphs">첫 사용: 장을 옮기는 상인들이 차양을 펴도록 시간을 번다.</tspan></text><path d="M60 866 H1140" stroke="#347368" stroke-width="2" opacity=".45"/></svg>