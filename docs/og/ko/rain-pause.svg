<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="10초 빗방울 정지"><title>10초 빗방울 정지</title><desc>빗방울만 공중에서 잠깐 멈춘다. · 능력: 주변에 떨어지는 빗방울을 공중에 정지시킨다. · 발동 조건: 젖은 손으로 하늘을 가리키고 열까지 거꾸로 센다. · 한계: 반경 100 m, 열 초, 하루 한 번. 바람과 번개는 그대로다. · 대가: 멈춘 비는 끝에 한꺼번에 쏟아지고 당신의 신발은 하루 삑삑댄다. · 첫 사용: 장을 옮기는 상인들이 차양을 펴도록 시간을 번다.</desc><rect width="1200" height="900" rx="28" fill="#fbfaf6"/><path d="M60 34 H1140" stroke="#347368" stroke-width="5" stroke-linecap="round"/><svg x="620" y="60" width="530" height="397.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="10초 빗방울 정지"><title>10초 빗방울 정지</title><desc>빗방울만 공중에서 잠깐 멈춘다.</desc><rect width="800" height="600" rx="36" fill="#ecf5e9"/><circle cx="400" cy="277" r="223" fill="#fff" opacity=".38"/><path d="M71 488 Q180 445 262 474 M538 474 Q620 445 729 488" fill="none" stroke="#347368" stroke-width="2" opacity=".19"/><ellipse cx="400" cy="553" rx="186" ry="17" fill="#347368" opacity=".13"/><g transform="rotate(0 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(30 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(60 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(90 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(150 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(180 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#347368" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(210 400 290)"><path d="M400 112 L400 139