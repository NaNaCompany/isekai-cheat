<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="임시 연결문"><title>임시 연결문</title><desc>같은 건물의 두 문을 잠깐 잇는다. · 능력: 직접 지나온 두 문 사이를 한 걸음으로 연결한다. · 발동 조건: 양쪽 문에 같은 분필 원을 완성한다. · 한계: 같은 건물 안 200 m 이내, 10초간 한 명만 통과. · 대가: 통과 후 도착한 문은 한 시간 뻑뻑해진다. · 첫 사용: 잊은 장부를 가지러 여관 아래층으로 간다.</desc><rect width="1200" height="900" rx="28" fill="#fbfaf6"/><path d="M60 34 H1140" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/><svg x="620" y="60" width="530" height="397.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="임시 연결문"><title>임시 연결문</title><desc>같은 건물의 두 문을 잠깐 잇는다.</desc><rect width="800" height="600" rx="36" fill="#eef3fb"/><circle cx="400" cy="277" r="223" fill="#fff" opacity=".38"/><path d="M71 488 Q180 445 262 474 M538 474 Q620 445 729 488" fill="none" stroke="#3d6b91" stroke-width="2" opacity=".19"/><ellipse cx="400" cy="553" rx="186" ry="17" fill="#3d6b91" opacity=".13"/><g transform="rotate(0 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(30 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(60 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(90 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(120 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(150 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(180 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(210 400 290)"><path d="M400 112 L400 139" fill="none" stroke="#3d6b91" stroke